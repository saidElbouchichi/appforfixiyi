services:
  mongodb:
    image: mongo:7
    container_name: fixiyi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fixiyi
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixiyi-network

  redis:
    image: redis:7-alpine
    container_name: fixiyi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fixiyi-network

  # `quay.io/minio/minio` stopped answering anonymous pulls (401) between the
  # 2026-09-23 and the 2026-09-25, and `minio/minio` on Docker Hub is gated
  # too: a fresh clone could no longer stand up its own stack. This build is
  # pullable and starts the server by itself, hence no `command:`.
  #
  # Migrating an existing stack: it runs as uid 1001 where the previous
  # image ran as root, so a `minio_data` volume created before the switch
  # is unreadable to it (`Permission denied` on .root_user). Drop it —
  # `docker volume rm fixiyi_minio_data` — the bucket is recreated at boot.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    container_name: fixiyi-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - fixiyi-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  fixiyi-network:
    driver: bridge