name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: install -> lint -> typecheck -> test -> build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same pinned image as docker-compose.yml, so the object storage the e2e
      # suites boot against is the one dev runs.
      #
      # Not `quay.io/minio/minio`: that image stopped answering anonymous
      # pulls (401 on the manifest) between 2026-09-23 and 2026-09-25, taking
      # this workflow — and any fresh clone's `docker compose up` — with it.
      # `minio/minio` on Docker Hub is gated too. This build starts the server
      # by itself, so it needs no command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.5.24
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready within 30s"
          docker logs minio
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Design phase 15 (Decision 87): the browser suite against the real dev
  # stack, in the same Linux image as `pnpm test:visual` locally — the only
  # renderer the visual references in tests/browser/visual are compared with.
  browser:
    name: browser suite + visual references (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # The example file with fresh signing secrets: nothing public signs a token, even in CI.
      - name: Environment of the dev stack
        run: |
          cp .env.example .env
          for key in JWT_SECRET JWT_REFRESH_SECRET OTP_SECRET; do
            sed -i "s|^${key}=.*|${key}=$(openssl rand -hex 32)|" .env
          done

      - name: Start the dev stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait

      - name: Browser suite, visual references compared
        run: node scripts/visual/run.mjs

      - name: Playwright diffs and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: tests/browser/test-results
          retention-days: 7

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail 200
