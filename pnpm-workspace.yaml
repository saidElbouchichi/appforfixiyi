packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - dotenv@18.0.1
  - '@eslint-react/ast@5.20.0'
  - '@eslint-react/core@5.20.0'
  - '@eslint-react/eslint-plugin@5.20.0'
  - '@eslint-react/eslint@5.20.0'
  - '@eslint-react/jsx@5.20.0'
  - '@eslint-react/shared@5.20.0'
  - '@eslint-react/var@5.20.0'
  - eslint-plugin-react-dom@5.20.0
  - eslint-plugin-react-jsx@5.20.0
  - eslint-plugin-react-naming-convention@5.20.0
  - eslint-plugin-react-rsc@5.20.0
  - eslint-plugin-react-web-api@5.20.0
  - eslint-plugin-react-x@5.20.0
