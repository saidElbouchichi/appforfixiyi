services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fixiyi-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongodb:27017/fixiyi
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      API_URL: http://api:4000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fixiyi-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: fixiyi-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fixiyi-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fixiyi-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - fixiyi-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: fixiyi-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - fixiyi-network

networks:
  fixiyi-network:
    driver: bridge
